name: FenixHost 自动续期

on:
  schedule:
    # 默认每天 UTC 16:30 运行（北京时间 00:30）
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ========== 1. 拉取私库脚本 ==========
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: fgnb666/fenixhost.net
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: ./fenixhost
          sparse-checkout: |
            scripts/fenixhost/fenixhost.py
            scripts/fenixhost/cookies.txt
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      # ========== 2. 设置 Python ==========
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ========== 3. 安装依赖 ==========
      - name: Install dependencies
        run: |
          pip install requests 'requests[socks]'

      # ========== 4. 设置代理 ==========
      - name: Setup proxy with sing-box
        env:
          FENIX_PROXY: ${{ secrets.FENIX_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          # 检查代理是否配置
          if [ -z "$FENIX_PROXY" ]; then
            echo "::error::未配置 FENIX_PROXY，禁止直连"
            
            # 如果有 TG 配置则发送告警
            if [ -n "$TG_BOT" ]; then
              CHAT_ID=$(echo "$TG_BOT" | cut -d',' -f1)
              TOKEN=$(echo "$TG_BOT" | cut -d',' -f2)
              MSG="🎮 FenixHost 续期通知%0A⏰ 时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')%0A❌ 错误: 未配置 FENIX_PROXY，禁止直连"
              curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}&text=${MSG}" > /dev/null 2>&1 || true
            fi
            exit 1
          fi
          
          # 执行代理设置脚本
          chmod +x ./fenixhost/scripts/setup_proxy.sh
          NODE_LINK="$FENIX_PROXY" bash ./fenixhost/scripts/setup_proxy.sh

      # ========== 5. 执行续期 ==========
      - name: Run renewal
        working-directory: ./fenixhost/scripts/fenixhost
        run: |
          python fenixhost.py 2>&1 | tee renew.log
        env:
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
          TG_BOT: ${{ secrets.TG_BOT }}
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

      # ========== 6. 提取下次运行时间 ==========
      - name: Extract next run time
        id: extract_next_run
        if: success()
        working-directory: ./fenixhost/scripts/fenixhost
        run: |
          NEXT_RUN=$(grep -oP '下次触发\(UTC\): \K\d{4}-\d{2}-\d{2} \d{2}:\d{2}' renew.log | tail -1 || true)
          
          if [ -z "$NEXT_RUN" ]; then
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未能提取下次运行时间，跳过 Cron 更新"
            exit 0
          fi
          
          echo "next_run=$NEXT_RUN" >> "$GITHUB_OUTPUT"
          echo "skip_update=false" >> "$GITHUB_OUTPUT"
          echo "::notice::⏰ 下次运行时间: $NEXT_RUN UTC"

      # ========== 7. 自动更新 Cron ==========
      - name: Update next cron schedule
        if: success() && steps.extract_next_run.outputs.skip_update != 'true'
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          NEXT_RUN: ${{ steps.extract_next_run.outputs.next_run }}
        run: |
          set -e
          
          # 计算新的 Cron 时间
          NEXT_MINUTE=$(date -u -d "$NEXT_RUN" +"%-M")
          NEXT_HOUR=$(date -u -d "$NEXT_RUN" +"%-H")
          NEXT_DAY=$(date -u -d "$NEXT_RUN" +"%-d")
          NEXT_MONTH=$(date -u -d "$NEXT_RUN" +"%-m")
          NEW_CRON="$NEXT_MINUTE $NEXT_HOUR $NEXT_DAY $NEXT_MONTH *"
          
          echo "::notice::📟 新 Cron: $NEW_CRON"
          
          # 切换到私库目录
          cd ./fenixhost
          
          # 配置 Git
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # 查找并更新 workflow 文件
          WORKFLOW_FILE=".github/workflows/fenixhost.yml"
          if [ ! -f "$WORKFLOW_FILE" ]; then
            echo "::error::找不到 fenixhost.yml"
            exit 1
          fi
          
          # 查找 cron 行
          LINE_NUM=$(grep -n "cron: '" "$WORKFLOW_FILE" | head -n1 | cut -d: -f1)
          if [ -z "$LINE_NUM" ]; then
            echo "::error::找不到 cron 行"
            exit 1
          fi
          
          # 更新 cron
          sed -i "${LINE_NUM}c\\    - cron: '$NEW_CRON'" "$WORKFLOW_FILE"
          
          # 提交更改
          git add "$WORKFLOW_FILE"
          if git diff --staged --quiet; then
            echo "::notice::Cron 无变化，无需提交"
            exit 0
          fi
          
          git commit -m "🔄 自动更新 FenixHost 续期 Cron [skip ci]" -m "下次运行: $NEXT_RUN UTC"
          git push
          echo "::notice::✅ Cron 更新成功"

      # ========== 8. 提交 Cookie 更新 ==========
      - name: Commit updated cookie
        if: success()
        run: |
          cd ./fenixhost
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          git add scripts/fenixhost/cookies.txt
          if git diff --staged --quiet; then
            echo "Cookie 无变化，跳过提交"
            exit 0
          fi
          
          git commit -m "🔄 自动更新 FenixHost Cookie [skip ci]"
          git push
          echo "✅ Cookie 已提交"

      # ========== 9. 清理代理进程 ==========
      - name: Cleanup proxy
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      # ========== 10. 清理运行记录 ==========
      - name: Clean workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6
