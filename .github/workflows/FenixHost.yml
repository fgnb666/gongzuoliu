name: FenixHost 自动续期

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ========== 1. 拉取私库脚本 ==========
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: fgnb666/fenixhost.net
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: fenixhost
          # 文件在根目录，不需要 sparse-checkout，或者直接拉取全部

      # ========== 2. 设置 Python ==========
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ========== 3. 安装依赖 ==========
      - name: Install dependencies
        run: |
          pip install requests 'requests[socks]'

      # ========== 4. 执行续期 ==========
      - name: Run renewal
        working-directory: fenixhost  # ✅ 改成根目录
        run: |
          python fenixhost.py 2>&1 | tee renew.log
        env:
          TG_BOT: ${{ secrets.TG_BOT }}

      # ========== 5. 提取下次运行时间 ==========
      - name: Extract next run time
        id: extract_next_run
        if: success()
        working-directory: fenixhost  # ✅ 改成根目录
        run: |
          NEXT_RUN=$(grep -oP '下次触发\(UTC\): \K\d{4}-\d{2}-\d{2} \d{2}:\d{2}' renew.log | tail -1 || true)
          
          if [ -z "$NEXT_RUN" ]; then
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未能提取下次运行时间，跳过 Cron 更新"
            exit 0
          fi
          
          echo "next_run=$NEXT_RUN" >> "$GITHUB_OUTPUT"
          echo "skip_update=false" >> "$GITHUB_OUTPUT"
          echo "::notice::⏰ 下次运行时间: $NEXT_RUN UTC"

      # ========== 6. 自动更新 Cron ==========
      - name: Update next cron schedule
        if: success() && steps.extract_next_run.outputs.skip_update != 'true'
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          NEXT_RUN: ${{ steps.extract_next_run.outputs.next_run }}
        run: |
          set -e
          
          NEXT_MINUTE=$(date -u -d "$NEXT_RUN" +"%-M")
          NEXT_HOUR=$(date -u -d "$NEXT_RUN" +"%-H")
          NEXT_DAY=$(date -u -d "$NEXT_RUN" +"%-d")
          NEXT_MONTH=$(date -u -d "$NEXT_RUN" +"%-m")
          NEW_CRON="$NEXT_MINUTE $NEXT_HOUR $NEXT_DAY $NEXT_MONTH *"
          
          echo "::notice::📟 新 Cron: $NEW_CRON"
          
          cd fenixhost
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          WORKFLOW_FILE=".github/workflows/fenixhost.yml"
          if [ ! -f "$WORKFLOW_FILE" ]; then
            echo "::error::找不到 fenixhost.yml"
            exit 1
          fi
          
          LINE_NUM=$(grep -n "cron: '" "$WORKFLOW_FILE" | head -n1 | cut -d: -f1)
          if [ -z "$LINE_NUM" ]; then
            echo "::error::找不到 cron 行"
            exit 1
          fi
          
          sed -i "${LINE_NUM}c\\    - cron: '$NEW_CRON'" "$WORKFLOW_FILE"
          
          git add "$WORKFLOW_FILE"
          if git diff --staged --quiet; then
            echo "::notice::Cron 无变化，无需提交"
            exit 0
          fi
          
          git commit -m "🔄 自动更新 FenixHost 续期 Cron [skip ci]" -m "下次运行: $NEXT_RUN UTC"
          git push
          echo "::notice::✅ Cron 更新成功"

      # ========== 7. 提交 Cookie 更新 ==========
      - name: Commit updated cookie
        if: success()
        run: |
          cd fenixhost
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          git add cookies.txt  # ✅ 改成根目录
          if git diff --staged --quiet; then
            echo "Cookie 无变化，跳过提交"
            exit 0
          fi
          
          git commit -m "🔄 自动更新 FenixHost Cookie [skip ci]"
          git push
          echo "✅ Cookie 已提交"

      # ========== 8. 清理运行记录 ==========
      - name: Clean workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6
