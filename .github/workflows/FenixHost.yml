name: FenixHost Auto Renew

on:
  schedule:
    - cron: '0 8 */2 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: fgnb666/fenixhost.net
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: ./fenixhost

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd ./fenixhost
          pip install requests

      - name: Run renew script
        run: |
          cd ./fenixhost
          python main.py
