name: FenixHost Renew

on:
  schedule:
    # 每天 UTC 时间 16:30 运行（北京时间 次日 00:30）
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: fgnb666/fenixhost.net
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: ./fenixhost

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests 'requests[socks]'

      - name: Setup proxy (sing-box)
        env:
          FENIX_PROXY: ${{ secrets.FENIX_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          if [ -z "$FENIX_PROXY" ]; then
            echo "::error::未配置 FENIX_PROXY，禁止直连"
            if [ -n "$TG_BOT" ]; then
              CHAT_ID=$(echo "$TG_BOT" | cut -d',' -f1)
              TOKEN=$(echo "$TG_BOT" | cut -d',' -f2)
              MSG="🎮 FenixHost 续期通知%0A⏰ 通知时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')%0A📊 结果：❌ 未配置 FENIX_PROXY，禁止直连"
              curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}&text=${MSG}" > /dev/null 2>&1 || true
            fi
            exit 1
          fi
          chmod +x ./fenixhost/scripts/setup_proxy.sh
          NODE_LINK="$FENIX_PROXY" bash ./fenixhost/scripts/setup_proxy.sh

      - name: Run renew
        run: |
          cd ./fenixhost/scripts/fenixhost
          python fenixhost.py
        env:
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
          TG_BOT: ${{ secrets.TG_BOT }}
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Extract next run time
        id: extract_next_run
        if: success()
        run: |
          cd ./fenixhost/scripts/fenixhost
          NEXT_RUN=$(grep -oP '下次触发\(UTC\): \K\d{4}-\d{2}-\d{2} \d{2}:\d{2}' renew.log | tail -1 || true)
          if [ -z "$NEXT_RUN" ]; then
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未能提取下次运行时间，跳过 Cron 更新"
            exit 0
          fi
          echo "next_run=$NEXT_RUN" >> "$GITHUB_OUTPUT"
          echo "skip_update=false" >> "$GITHUB_OUTPUT"
          echo "::notice::⏰ 下次运行时间: $NEXT_RUN UTC"

      - name: Update next cron
        if: success() && steps.extract_next_run.outputs.skip_update != 'true'
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          NEXT_RUN: ${{ steps.extract_next_run.outputs.next_run }}
        run: |
          set -e
          NEXT_MINUTE=$(date -u -d "$NEXT_RUN" +"%-M")
          NEXT_HOUR=$(date -u -d "$NEXT_RUN" +"%-H")
          NEXT_DAY=$(date -u -d "$NEXT_RUN" +"%-d")
          NEXT_MONTH=$(date -u -d "$NEXT_RUN" +"%-m")
          NEW_CRON="$NEXT_MINUTE $NEXT_HOUR $NEXT_DAY $NEXT_MONTH *"

          echo "::notice::📟 新 Cron: $NEW_CRON"
          
          cd ./fenixhost
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # 查找 workflow 文件
          WORKFLOW_FILE=".github/workflows/fenixhost.yml"
          if [ ! -f "$WORKFLOW_FILE" ]; then
            echo "::error::找不到 fenixhost.yml"
            exit 1
          fi

          LINE_NUM=$(grep -n "cron: '" "$WORKFLOW_FILE" | head -n1 | cut -d: -f1)
          if [ -z "$LINE_NUM" ]; then
            echo "::error::找不到 cron 行"
            exit 1
          fi

          sed -i "${LINE_NUM}c\\    - cron: '$NEW_CRON'" "$WORKFLOW_FILE"
          
          git add "$WORKFLOW_FILE"
          git diff --staged --quiet || git commit -m "🔄 自动更新 FenixHost 续期 Cron [skip ci]" -m "下次运行: $NEXT_RUN UTC"
          git push
          echo "::notice::✅ Cron 更新成功"

      - name: Commit updated cookie
        if: success()
        run: |
          cd ./fenixhost
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add scripts/fenixhost/cookies.txt
          git diff --staged --quiet || git commit -m "🔄 自动更新 FenixHost Cookie [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Cleanup proxy
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: Clean workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 6
