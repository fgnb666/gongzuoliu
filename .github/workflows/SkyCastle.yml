name: SkyCastle

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: fgnb666/panel.skycastle.us
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      - name: Set up WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: client

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: scripts
        run: pip install -r requirements.txt

      - name: Run renew script
        env:
          SKYCASTLE_API_KEY: ${{ secrets.SKYCASTLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: scripts
        run: python main.py

      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skycastle-api-responses
          path: scripts/*.json
          retention-days: 7
          if-no-files-found: ignore
