name: SkyCastle Auto Renew

on:
  schedule:
    - cron: '0 8 */6 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: fgnb666/panel.skycastle.us
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: ./skycastle

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd ./skycastle
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run renew script
        run: |
          cd ./skycastle
          python main.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COOKIE_LARAVEL_SESSION: ${{ secrets.COOKIE_LARAVEL_SESSION }}
          COOKIE_REMEMBER_TOKEN: ${{ secrets.COOKIE_REMEMBER_TOKEN }}
